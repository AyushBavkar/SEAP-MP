
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #171717, #392c1c);
            color: white;
        }

        .login-box {
            width: 350px;
            max-width: 90%;
            padding: 35px;
            background: #222222;
            border-radius: 12px;
            box-shadow: 0 10px 30px #0006;
        }

        h1 {
            color: #e8b45b;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #bbb;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #303030;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #e8b45b;
            color: #171717;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f5ca7d;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: #e8b45b;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>SAVOR</h1>
        <p class="subtitle">Restaurant Management System</p>

        <form onsubmit="loginDemo(event)">
            <label for="role">Login As</label>
            <select id="role" required>
                <option value="">Select your role</option>
                <option>Administrator</option>
                <option>Restaurant Manager</option>
                <option>Staff</option>
            </select>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Sign In</button>
        </form>

        <p class="back">
            <a href="index.html">← Back to Home</a>
        </p>
    </div>

    <script>
        function loginDemo(event) {
            event.preventDefault();
            alert("Sample login form submitted successfully!");
        }
    </script>

</body>
</html>
